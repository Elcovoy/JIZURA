name: MusicCue → JIZURA bridge tests

on:
  push:
    paths:
      - 'integrations/musicue-bridge/**'
      - '.github/workflows/musicue-bridge.yml'
  pull_request:
    paths:
      - 'integrations/musicue-bridge/**'
      - '.github/workflows/musicue-bridge.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native bridge behavior
        run: node integrations/musicue-bridge/musicue-bridge.test.cjs
      - name: Integration contract and source selection
        run: node integrations/musicue-bridge/musicue-bridge.contract.test.cjs